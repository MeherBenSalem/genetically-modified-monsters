plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev.legacyforge'
}

legacyForge {
    // Vanilla Minecraft with official names: common code compiles against no loader.
    mcpVersion = minecraft_version
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

dependencies {
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

// Every texture, model, blockstate, sound, language file, recipe, loot table, tag, worldgen file and advancement
// under src/generated is produced by tools/assets (python3 tools/assets/build.py). Do not edit them by hand.
sourceSets.main.resources.srcDir 'src/generated/resources'

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    sourceSets.main.resources.sourceDirectories.each { commonResources it }
}
