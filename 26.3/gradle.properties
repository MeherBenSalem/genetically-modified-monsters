# Important Notes:
# Every field you add must be added to build-logic/src/main/groovy/multiloader-common.gradle expandProps map.
# Loader, Fabric API, NeoForge and Gradle plugin versions match Modern-Building-Wands/26.2 (known to build).

# Project
version=2.0.2
group=com.nightbeam.sporeandstem
java_version=25

# Common
minecraft_version=26.3
mod_name=Spore & Stem
mod_author=NightBeam Studio
mod_id=spore_and_stem
license=Apache-2.0
credits=NightBeam Studio. Formerly Genetically Modified Monsters.
description=A whole kingdom of fungi. Giant glowing mushrooms and three fungal woods, nine new mushrooms in real 3D, cultivation logs, mushroom cooking, Mycoleather armor, the Mycosis infection, eight fungal creatures and the Myceliarch.
