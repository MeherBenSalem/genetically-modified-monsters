// Repository-root helper tasks. Each Minecraft version lives in its own self-contained Gradle workspace
// (its own wrapper and Java version); this file only drives them. Porting to a new version means adding one entry
// to WORKSPACES below and a matching folder.

def WORKSPACES = [
        [dir: '1.20.1', loaders: ['fabric', 'forge']],
        [dir: '1.21.1', loaders: ['fabric', 'neoforge']],
]

String wrapperCmd(String rootDirName) {
    File root = file(rootDirName)
    if (System.getProperty('os.name').toLowerCase().contains('win')) {
        return new File(root, 'gradlew.bat').absolutePath
    }
    return new File(root, 'gradlew').absolutePath
}

String javaHomeFor(String rootDirName) {
    def props = file("${rootDirName}/gradle.properties")
    if (!props.exists()) {
        return System.getenv('JAVA_HOME')
    }
    def javaVersion = props.readLines()
            .find { it.startsWith('java_version=') }
            ?.substring('java_version='.length())
    return System.getenv("JAVA_HOME_${javaVersion}") ?: System.getenv('JAVA_HOME')
}

String taskSuffix(String dir) {
    return dir.replace('.', '')
}

WORKSPACES.each { ws ->
    ['build', 'clean'].each { action ->
        tasks.register("${action}${taskSuffix(ws.dir)}", Exec) {
            group = 'build'
            description = "${action.capitalize()} the ${ws.dir} workspace (${ws.loaders.join(' + ')})."
            workingDir = file(ws.dir)
            def jh = javaHomeFor(ws.dir)
            if (jh) {
                environment 'JAVA_HOME', jh
            }
            commandLine wrapperCmd(ws.dir), action, '--no-daemon'
        }
    }
}

tasks.register('dist') {
    group = 'build'
    description = 'Build every workspace and copy every release JAR into all-jars/.'
    dependsOn WORKSPACES.collect { "build${taskSuffix(it.dir)}" }
    notCompatibleWithConfigurationCache('Copies workspace JARs with dynamic file trees.')
    doLast {
        def outDir = project.layout.projectDirectory.dir('all-jars').asFile
        outDir.mkdirs()
        WORKSPACES.each { ws ->
            ws.loaders.each { loader ->
                def libsDir = project.file("${ws.dir}/${loader}/build/libs")
                if (libsDir.exists()) {
                    project.fileTree(libsDir).matching {
                        include '*.jar'
                        exclude '*-sources.jar', '*-javadoc.jar', '*-dev.jar', '*-shadow.jar', '*-dev-shadow.jar'
                    }.each { jar ->
                        project.copy {
                            from jar
                            into outDir
                        }
                    }
                }
            }
        }
        println "All JARs collected in: ${outDir.absolutePath}"
    }
}

tasks.register('buildAll') {
    group = 'build'
    description = 'Build every workspace and collect the JARs into all-jars/.'
    dependsOn 'dist'
}

tasks.register('cleanAll') {
    group = 'build'
    description = 'Clean every workspace and all-jars/.'
    dependsOn WORKSPACES.collect { "clean${taskSuffix(it.dir)}" }
    doLast {
        def outDir = file('all-jars')
        if (outDir.exists()) {
            outDir.deleteDir()
            println 'Cleaned all-jars directory.'
        }
    }
}

tasks.register('syncVersion') {
    group = 'build'
    description = 'Set version= in every workspace gradle.properties (use -PmodVersion=x.y.z or the VERSION file).'
    doLast {
        def v = project.findProperty('modVersion')
        if (!v) {
            def versionFile = file('VERSION')
            if (versionFile.exists()) {
                v = versionFile.text.trim()
            }
        }
        if (!v) {
            throw new GradleException('Pass -PmodVersion=x.y.z or add a VERSION file at repo root.')
        }
        file('VERSION').text = v + System.lineSeparator()
        WORKSPACES.each { ws ->
            def props = file("${ws.dir}/gradle.properties")
            if (!props.exists()) {
                throw new GradleException("Missing ${props}")
            }
            def updated = false
            def out = props.readLines().collect { line ->
                if (line.startsWith('version=')) {
                    updated = true
                    return "version=${v}"
                }
                return line
            }
            if (!updated) {
                throw new GradleException("No version= line in ${props}")
            }
            props.text = out.join(System.lineSeparator()) + System.lineSeparator()
            println "Synced ${props} -> ${v}"
        }
    }
}
