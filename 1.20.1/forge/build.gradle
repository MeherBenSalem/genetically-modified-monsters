plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev.legacyforge'
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"
    // Automatically enable AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('forge.enabledGameTestNamespaces', mod_id)
            ideName = "Forge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
            gameDirectory = project.file('runs/client')
        }
        server {
            server()
            gameDirectory = project.file('runs/server')
            programArgument '--nogui'
            jvmArgument '-Xmx1536M'
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('build/gametest')
            jvmArgument '-Xmx1536M'
        }
        // QA client: joins a server on localhost:25565 straight away (see tools/qa/).
        qaClient {
            client()
            gameDirectory = project.file('runs/client')
            jvmArgument '-Xmx2G'
            programArguments.addAll '--quickPlayMultiplayer', "localhost:${System.getenv('QA_PORT') ?: '25565'}", '--username', 'Mycologist', '--width', '1920', '--height', '1080'
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// Common mixins (spore_and_stem.mixins.json): the refmap maps them to SRG names for production.
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    // @Nullable in common code: vanilla and Fabric bring these annotations, Forge 47's dev classpath does not.
    compileOnly 'org.jetbrains:annotations:24.1.0'
}

// Forge 1.20.1 runs on SRG names: the released jar is the reobfuscated one.
jar {
    manifest.attributes(['MixinConfigs': "${mod_id}.mixins.json"])
    finalizedBy('reobfJar')
}
