# Dual-publish Spore & Stem to Modrinth + CurseForge on version tags.
#
# Each release jar is its own Modrinth version and its own CurseForge file.
# Loader and Minecraft game version are parsed from the filename:
#   spore_and_stem-<loader>-<minecraft>-<modVersion>.jar
# Examples: spore_and_stem-neoforge-1.21.1-2.0.0.jar, spore_and_stem-forge-1.20.1-2.0.0.jar
# Fabric files declare Fabric API as a required dependency.
#
# Org/repo secrets:
#   MODRINTH_TOKEN
#   CURSEFORGE_TOKEN
#   CURSEFORGE_API_KEY
#
# Repo variables:
#   MODRINTH_ID
#   CURSEFORGE_ID
#
# Usage after a release build is ready:
#   git tag v1.2.3 && git push --tags

name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version (without v) when not tagging
        required: false
      dry_run:
        description: Skip uploads if true
        required: false
        default: "false"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.version }}" ]]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "Provide a v*.*.* tag or workflow_dispatch version" >&2
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21

      - uses: gradle/actions/setup-gradle@v4

      # Each Minecraft workspace has its own Gradle wrapper and java_version pin,
      # so build each one with its own JDK instead of the repo-root wrapper.
      - name: Build all workspaces
        env:
          JAVA_HOME_17: ${{ env.JAVA_HOME_17_X64 }}
          JAVA_HOME_21: ${{ env.JAVA_HOME_21_X64 }}
        run: |
          set -euo pipefail
          unset JAVA_HOME

          require_java() {
            local label="$1"
            local home="$2"
            if [[ -z "${home}" || ! -x "${home}/bin/java" ]]; then
              echo "Missing ${label} JDK at '${home:-<empty>}'" >&2
              exit 1
            fi
          }

          build_workspace() {
            local dir="$1"
            local home="$2"
            echo "::group::${dir} ($( "${home}/bin/java" -version 2>&1 | head -n 1 ))"
            (
              cd "${dir}"
              chmod +x gradlew
              export JAVA_HOME="${home}"
              export PATH="${JAVA_HOME}/bin:${PATH}"
              ./gradlew build --no-daemon
            )
            echo "::endgroup::"
          }

          # One line per Minecraft workspace (each has its own Gradle wrapper and Java version).
          require_java JAVA_HOME_17 "${JAVA_HOME_17}"
          require_java JAVA_HOME_21 "${JAVA_HOME_21}"
          build_workspace 1.20.1 "${JAVA_HOME_17}"
          build_workspace 1.21.1 "${JAVA_HOME_21}"

          mkdir -p all-jars
          # Forge 1.20.1: build/libs holds the reobfuscated (SRG) jar; the dev jar is in build/devlibs.
          for mod_dir in 1.20.1/fabric 1.20.1/forge 1.21.1/fabric 1.21.1/neoforge; do
            if [[ -d "${mod_dir}/build/libs" ]]; then
              find "${mod_dir}/build/libs" -maxdepth 1 -type f -name 'spore_and_stem-*.jar' \
                ! -name '*-sources.jar' ! -name '*-javadoc.jar' \
                ! -name '*-dev.jar' ! -name '*-shadow.jar' ! -name '*-dev-shadow.jar' \
                -exec cp -f {} all-jars/ \;
            fi
          done
          echo "Collected jars:"
          ls -1 all-jars

      - name: Find jars
        id: jars
        shell: bash
        run: |
          mapfile -t JARS < <(find all-jars -type f -name "spore_and_stem-*.jar" 2>/dev/null | sort)
          if [ ${#JARS[@]} -eq 0 ]; then
            mapfile -t JARS < <(find . -type f -path "*/build/libs/spore_and_stem-*.jar" \
              ! -name "*-sources.jar" ! -name "*-javadoc.jar" \
              ! -name "*-dev.jar" ! -name "*-dev-shadow.jar" \
              ! -name "*-common-*.jar" ! -name "*-shadow.jar" | sort)
          fi
          if [ ${#JARS[@]} -eq 0 ]; then
            echo "No jars in all-jars or build/libs" >&2
            exit 1
          fi
          printf '%s\n' "${JARS[@]}"
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "list<<$EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${JARS[@]}" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Upload Modrinth + CurseForge
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          MODRINTH_ID: ${{ vars.MODRINTH_ID }}
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}
          VERSION: ${{ steps.ver.outputs.version }}
          JAR_LIST: ${{ steps.jars.outputs.list }}
          DRY_RUN: ${{ inputs.dry_run == 'true' && 'true' || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${DRY_RUN}" != "true" ]]; then
            # Fail before any upload, naming what is missing (a failed `test` inside `&&` does not stop `set -e`).
            missing=()
            for name in MODRINTH_TOKEN CURSEFORGE_TOKEN CURSEFORGE_API_KEY MODRINTH_ID CURSEFORGE_ID; do
              [[ -n "${!name:-}" ]] || missing+=("${name}")
            done
            if (( ${#missing[@]} )); then
              echo "::error::Not set in Settings > Secrets and variables > Actions: ${missing[*]} (tokens are secrets, the two IDs are variables)" >&2
              exit 1
            fi
          fi
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const version = process.env.VERSION;
          const dryRun = process.env.DRY_RUN === 'true';
          const JAR_RE = /^spore_and_stem-(fabric|neoforge|forge)-(\d+(?:\.\d+){1,2})-(\d+\.\d+\.\d+)\.jar$/i;
          const CF_LOADER_IDS = { fabric: 7499, forge: 7498, neoforge: 10150 };

          function parseJar(jar) {
            const name = path.basename(jar);
            const m = name.match(JAR_RE);
            if (!m) {
              throw new Error(
                'Cannot parse loader/game from ' + name +
                ' (expected spore_and_stem-<loader>-<minecraft>-<modVersion>.jar)',
              );
            }
            return { jar, name, loader: m[1].toLowerCase(), game: m[2], modVersion: m[3] };
          }

          function loaderLabel(loader) {
            if (loader === 'neoforge') return 'NeoForge';
            if (loader === 'forge') return 'Forge';
            return 'Fabric';
          }

          async function readJson(url, headers, allowStatuses = []) {
            const res = await fetch(url, { headers });
            const text = await res.text();
            if (!res.ok) {
              if (allowStatuses.includes(res.status)) return { ok: false, status: res.status, json: null, text };
              throw new Error(url + ' -> ' + res.status + ' ' + text.slice(0, 400));
            }
            return { ok: true, status: res.status, json: text ? JSON.parse(text) : null, text };
          }

          async function resolveCurseForgeGameId(game, apiKey, token) {
            const mc = await readJson(
              'https://api.curseforge.com/v1/minecraft/version/' + encodeURIComponent(game),
              { 'x-api-key': apiKey, Accept: 'application/json' },
              [404],
            );
            const directId = mc.json?.data?.gameVersionId;
            if (directId) {
              console.log('CF Minecraft', game, '-> gameVersionId', directId);
              return directId;
            }

            const legacy = await readJson('https://minecraft.curseforge.com/api/game/versions', {
              'X-Api-Token': token,
            });
            const flat = Array.isArray(legacy.json) ? legacy.json : legacy.json?.data || [];
            const slug = game.replace(/\./g, '-');
            const hits = flat.filter((v) => v.name === game || v.slug === slug || v.name === 'Minecraft ' + game);
            const typesPayload = await readJson(
              'https://api.curseforge.com/v1/games/432/version-types',
              { 'x-api-key': apiKey, Accept: 'application/json' },
              [403, 404],
            );
            const minecraftTypeIds = [];
            for (const type of typesPayload.json?.data || []) {
              if (/minecraft/i.test(type.name) && !/bukkit|spigot|paper|plugin/i.test(type.name)) {
                minecraftTypeIds.push(type.id);
              }
            }
            for (const typeId of [...minecraftTypeIds, 88556, 86297, 77784, 75125, 1]) {
              const hit = hits.find((v) => v.gameVersionTypeID === typeId);
              if (hit) {
                console.log('CF Minecraft', game, '-> legacy id', hit.id, 'type', hit.gameVersionTypeID);
                return hit.id;
              }
            }
            if (hits[0]) {
              console.log('CF Minecraft', game, '-> legacy id', hits[0].id);
              return hits[0].id;
            }
            throw new Error('No CurseForge game version id for ' + game + ' (refusing to skip or substitute 1.x)');
          }

          async function resolveNamedLegacyId(token, want) {
            const legacy = await readJson('https://minecraft.curseforge.com/api/game/versions', {
              'X-Api-Token': token,
            });
            const flat = Array.isArray(legacy.json) ? legacy.json : legacy.json?.data || [];
            const hit = flat.find((v) => v.name === want);
            if (!hit) throw new Error('No CurseForge version named ' + want);
            return hit.id;
          }

          const jars = process.env.JAR_LIST.split(/\n/).map((s) => s.trim()).filter(Boolean)
            .filter((j) => {
              const n = path.basename(j).toLowerCase();
              return !n.includes('-sources') && !n.includes('-javadoc') && !n.includes('-dev') && !n.includes('-shadow') && !n.includes('-common-');
            });
          if (!jars.length) throw new Error('No release jars to publish');
          const parsed = jars.map(parseJar);
          for (const p of parsed) {
            console.log('Parsed', p.name, '-> loader=' + p.loader, 'minecraft=' + p.game);
          }

          (async () => {
            if (dryRun) {
              console.log('Dry run: skipping uploads for', parsed.length, 'jars');
              return;
            }

            const notes = 'patchnotes/' + version + '.md';
            const changelog = fs.existsSync(notes)
              ? fs.readFileSync(notes, 'utf8')
              : (fs.existsSync('CHANGELOG.md') ? fs.readFileSync('CHANGELOG.md', 'utf8') : ('Release ' + version));

            for (const p of parsed) {
              const body = {
                name: version + ' · ' + loaderLabel(p.loader) + ' · ' + p.game,
                version_number: version + '+' + p.loader + '-' + p.game,
                changelog,
                // Fabric API (Modrinth project P7dR8mSH) is required on Fabric.
                dependencies: p.loader === 'fabric' ? [{ project_id: 'P7dR8mSH', dependency_type: 'required' }] : [],
                game_versions: [p.game],
                version_type: 'release',
                loaders: [p.loader],
                featured: false,
                status: 'listed',
                project_id: process.env.MODRINTH_ID,
                file_parts: ['file_0'],
                primary_file: 'file_0',
              };
              const form = new FormData();
              form.append('data', JSON.stringify(body));
              form.append('file_0', new Blob([fs.readFileSync(p.jar)]), p.name);
              const mrRes = await fetch('https://api.modrinth.com/v2/version', {
                method: 'POST',
                headers: { Authorization: process.env.MODRINTH_TOKEN },
                body: form,
              });
              const mrText = await mrRes.text();
              if (!mrRes.ok) throw new Error('Modrinth ' + mrRes.status + ' ' + p.name + ' ' + mrText.slice(0, 500));
              console.log('Modrinth OK', body.version_number, p.name);
            }

            const clientId = await resolveNamedLegacyId(process.env.CURSEFORGE_TOKEN, 'Client');
            const serverId = await resolveNamedLegacyId(process.env.CURSEFORGE_TOKEN, 'Server');

            for (const p of parsed) {
              const loaderId = CF_LOADER_IDS[p.loader];
              if (!loaderId) throw new Error('Unknown CurseForge loader id for ' + p.loader);
              const gameId = await resolveCurseForgeGameId(
                p.game,
                process.env.CURSEFORGE_API_KEY,
                process.env.CURSEFORGE_TOKEN,
              );
              const meta = {
                changelog,
                ...(p.loader === 'fabric' ? { relations: { projects: [{ slug: 'fabric-api', type: 'requiredDependency' }] } } : {}),
                changelogType: 'markdown',
                displayName: version + ' · ' + loaderLabel(p.loader) + ' · ' + p.game,
                gameVersions: [clientId, serverId, loaderId, gameId],
                releaseType: 'release',
              };
              const cfForm = new FormData();
              cfForm.append('metadata', JSON.stringify(meta));
              cfForm.append('file', new Blob([fs.readFileSync(p.jar)]), p.name);
              const cfRes = await fetch(
                'https://minecraft.curseforge.com/api/projects/' + process.env.CURSEFORGE_ID + '/upload-file',
                { method: 'POST', headers: { 'X-Api-Token': process.env.CURSEFORGE_TOKEN }, body: cfForm },
              );
              const cfText = await cfRes.text();
              if (!cfRes.ok) throw new Error('CurseForge ' + cfRes.status + ' ' + p.name + ' ' + cfText.slice(0, 500));
              console.log('CurseForge OK', meta.displayName, p.name, 'minecraftId=' + gameId);
            }
          })().catch((e) => { console.error(e); process.exit(1); });
          NODE
