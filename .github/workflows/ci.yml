# CI for Spore & Stem (NightBeam convention; modelled on RE:Constructed Wands' ci.yml).
# Builds all 8 jars (1.20.1 Fabric + Forge; 1.21.1, 26.2, 26.3 Fabric + NeoForge) with ./gradlew buildAll,
# checks that every workspace has the same version= and that the metadata ranges stay inside their Minecraft line,
# runs the same-day guard tests, and checks that the upload step can read loader + Minecraft version from every
# built jar name. It never publishes anything.

name: CI

on:
  push:
    branches: [main]
    paths:
      - "1.20.1/**"
      - "1.21.1/**"
      - "26.2/**"
      - "26.3/**"
      - "scripts/**"
      - "tools/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "VERSION"
      # Bundled into every jar by the workspaces' builds.
      - "LICENSE"
      - "NOTICE"
      - "releases/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Check publisher syntax
        run: |
          for f in scripts/*.mjs; do node --check "$f"; done
      - name: Test publisher scripts (same-day guard)
        run: node --test scripts/*.test.mjs
      - name: Check the Python tools compile
        run: python3 -m py_compile scripts/*.py tools/*.py tools/assets/*.py tools/assets/ss/*.py tools/assets/ss/ports/*.py tools/qa/*.py
      - name: Check the 8 targets, one version and metadata ranges
        run: python3 scripts/check_targets.py workspaces

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 21 stays JAVA_HOME (Gradle for 1.20.1/1.21.1); 17 is the 1.20.1 toolchain; the root build hands 26.x
      # JAVA_HOME_25_X64.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            25
            21
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build all 8 jars and run the unit tests
        run: |
          chmod +x gradlew 1.20.1/gradlew 1.21.1/gradlew 26.2/gradlew 26.3/gradlew
          ./gradlew buildAll --no-daemon
      - name: Check the 8 jars
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 scripts/check_targets.py version)"
          python3 scripts/check_targets.py jars --version "$version" --dir releases --list-file ci-jars.txt
          mkdir -p ci-jars
          xargs -a ci-jars.txt cp -f -t ci-jars/
          # The same pattern the upload step in publish.yml reads loader + Minecraft version with.
          node -e '
            const path = require("path");
            const re = /^spore_and_stem-(fabric|neoforge|forge)-(\d+(?:\.\d+){1,2})-(\d+\.\d+\.\d+)\.jar$/i;
            const jars = require("fs").readFileSync("ci-jars.txt", "utf8").split("\n").filter(Boolean);
            for (const jar of jars) {
              const m = path.basename(jar).match(re);
              if (!m) { console.error("::error::upload step cannot parse " + jar); process.exit(1); }
              console.log(path.basename(jar) + " -> loader=" + m[1] + " minecraft=" + m[2]);
            }
          '
      - uses: actions/upload-artifact@v4
        with:
          name: spore_and_stem-jars
          path: ci-jars/*.jar
          if-no-files-found: error
