# Publish Spore & Stem to Modrinth + CurseForge (NightBeam convention).
#
# Runs only by hand (workflow_dispatch) or on a v*.*.* tag; a push to main never releases anything.
# Uses exactly the 8 convention jars for the version, in this order of sources:
#   1. releases/spore_and_stem-<loader>-<minecraft>-<version>.jar committed to the repo,
#   2. the jars attached to the GitHub Release v<version>,
#   3. a build from source: ./gradlew buildAll (the workspaces must be at <version>).
# The run fails unless all 8 are found: 1.20.1 Fabric + Forge; 1.21.1, 26.2 and 26.3 Fabric + NeoForge.
# Each jar is its own Modrinth version and its own CurseForge file; loader and Minecraft version are read from the
# file name (spore_and_stem-<loader>-<minecraft>-<version>.jar). Fabric files require Fabric API.
#
# Same-day guard (NightBeam convention): scripts/same_day_guard.mjs stops the run if this mod already had a
# release today (Africa/Tunis day), on Modrinth, CurseForge or an earlier Publish run. A dry run only reports it.
# It runs before building and again right before the upload, whatever the inputs below say.
#
# Repo secrets: MODRINTH_TOKEN, CURSEFORGE_TOKEN (upload API token), CURSEFORGE_API_KEY (Core API key, read by the
#   same-day guard). Older setups that kept the upload token in CURSEFORGE_API_KEY still work: the upload falls
#   back to it when CURSEFORGE_TOKEN is not set.
# Repo variables: MODRINTH_ID, CURSEFORGE_ID (also read from secrets of the same name, as before). Without either,
#   the project ids are Modrinth 56wxSt5P and CurseForge 1390363.
#
# Prove it first:  gh workflow run publish.yml -f version=2.0.2 -f dry_run=true
# Release:         gh workflow run publish.yml -f version=2.0.2   (or: git tag v2.0.2 && git push origin v2.0.2)

name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version (without v) when not tagging; matches jar names / GitHub Release
        required: false
      dry_run:
        description: Skip uploads if true (the same-day guard only reports)
        required: false
        default: "false"
      minecraft_version:
        description: "Optional: upload only this Minecraft version's jars (1.20.1, 1.21.1, 26.2 or 26.3); the same-day guard still applies"
        required: false
      update_listing:
        description: "Also update the Modrinth description and summary from marketing/modrinth (true/false)"
        required: false
        default: "false"

# One Publish at a time per repo, so two runs can't both pass the same-day guard.
concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [[ -n "$VERSION_INPUT" ]]; then
            echo "version=${VERSION_INPUT#v}" >> "$GITHUB_OUTPUT"
          else
            echo "Provide a v*.*.* tag or workflow_dispatch version" >&2
            exit 1
          fi

      # Runs before the long build. Only true/false is printed for each name, never a value.
      - name: Check publishing credentials
        if: ${{ inputs.dry_run != 'true' }}
        env:
          HAS_MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN != '' }}
          HAS_CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN != '' || secrets.CURSEFORGE_API_KEY != '' }}
          HAS_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY != '' }}
          TOKENS_IN_VARIABLES: ${{ vars.MODRINTH_TOKEN != '' || vars.CURSEFORGE_TOKEN != '' || vars.CURSEFORGE_API_KEY != '' }}
        shell: bash
        run: |
          echo "MODRINTH_TOKEN secret: ${HAS_MODRINTH_TOKEN}"
          echo "CURSEFORGE_TOKEN (or CURSEFORGE_API_KEY) secret: ${HAS_CURSEFORGE_TOKEN}"
          echo "CURSEFORGE_API_KEY secret (same-day guard on CurseForge): ${HAS_CURSEFORGE_API_KEY}"
          echo "a token saved as a repository variable: ${TOKENS_IN_VARIABLES}"
          if [[ "${TOKENS_IN_VARIABLES}" == "true" ]]; then
            echo "::error::A token is saved as a repository *variable*. Variables are not secret and are not read for tokens: delete it from the Variables tab and add it under Settings > Secrets and variables > Actions > Secrets."
            exit 1
          fi
          if [[ "${HAS_MODRINTH_TOKEN}${HAS_CURSEFORGE_TOKEN}" != "truetrue" ]]; then
            echo "::error::Missing repository secrets (see the list above). Tokens go in the Secrets tab as repository secrets, not Environment, Dependabot or Codespaces secrets."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test publisher scripts
        run: node --test scripts/*.test.mjs

      - name: Same-day guard
        env:
          MODRINTH_ID: ${{ vars.MODRINTH_ID || secrets.MODRINTH_ID || '56wxSt5P' }}
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID || secrets.CURSEFORGE_ID || '1390363' }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISH_WORKFLOW: publish.yml
          UPLOAD_STEP: Upload Modrinth + CurseForge
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/same_day_guard.mjs

      - name: Find prebuilt release jars
        id: prebuilt
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # Only the 8 convention names are ever picked up; anything else for this version is ignored.
          mapfile -t NAMES < <(python3 -c 'import sys; sys.path.insert(0, "scripts"); import check_targets as c; print("\n".join(sorted(c.expected_names(sys.argv[1]))))' "$VERSION")
          found=0
          for name in "${NAMES[@]}"; do
            if [ -f "releases/$name" ]; then
              cp -f "releases/$name" dist/
              found=$((found + 1))
            fi
          done
          if [ "$found" -gt 0 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Using $found prebuilt jar(s) from releases/"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No convention jars for ${VERSION} in releases/; will try the GitHub Release, then build from source"
          fi

      - name: Download GitHub release jars
        id: ghrelease
        if: steps.prebuilt.outputs.found != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          patterns=()
          while IFS= read -r name; do patterns+=(--pattern "$name"); done < <(python3 -c 'import sys; sys.path.insert(0, "scripts"); import check_targets as c; print("\n".join(sorted(c.expected_names(sys.argv[1]))))' "$VERSION")
          if gh release view "v${VERSION}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release download "v${VERSION}" --repo "${{ github.repository }}" --dir dist --clobber "${patterns[@]}" || true
          fi
          count=$(find dist -maxdepth 1 -name 'spore_and_stem-*.jar' | wc -l)
          if [ "$count" -gt 0 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Using $count jar(s) from GitHub Release v${VERSION}"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No GitHub Release jars for v${VERSION}; building from source"
          fi

      # 21 stays JAVA_HOME (Gradle for 1.20.1/1.21.1); 17 is the 1.20.1 toolchain; the root build hands 26.x
      # JAVA_HOME_25_X64.
      - uses: actions/setup-java@v4
        if: steps.prebuilt.outputs.found != 'true' && steps.ghrelease.outputs.found != 'true'
        with:
          distribution: temurin
          java-version: |
            17
            25
            21

      - uses: gradle/actions/setup-gradle@v4
        if: steps.prebuilt.outputs.found != 'true' && steps.ghrelease.outputs.found != 'true'

      - name: Build from source
        if: steps.prebuilt.outputs.found != 'true' && steps.ghrelease.outputs.found != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/check_targets.py workspaces
          ws_version="$(python3 scripts/check_targets.py version)"
          if [ "$ws_version" != "$VERSION" ]; then
            echo "::error::The workspaces are at ${ws_version}, not ${VERSION}. Bump them first (./gradlew syncVersion -PmodVersion=${VERSION})."
            exit 1
          fi
          chmod +x gradlew 1.20.1/gradlew 1.21.1/gradlew 26.2/gradlew 26.3/gradlew
          ./gradlew buildAll --no-daemon
          python3 scripts/check_targets.py jars --version "$VERSION" --dir releases --list-file built-jars.txt
          mkdir -p dist
          xargs -a built-jars.txt cp -f -t dist/

      - name: Verify release jars
        id: jars
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          MC_FILTER: ${{ inputs.minecraft_version }}
        run: |
          set -euo pipefail
          # Exactly the 8 convention jars, one per loader + Minecraft pair, or the run stops here.
          python3 scripts/check_targets.py jars --version "$VERSION" --dir dist --list-file jar-list.txt
          mapfile -t JARS < jar-list.txt
          if [ -n "$MC_FILTER" ]; then
            case "$MC_FILTER" in
              1.20.1|1.21.1|26.2|26.3) ;;
              *) echo "::error::minecraft_version must be 1.20.1, 1.21.1, 26.2 or 26.3, not ${MC_FILTER}"; exit 1 ;;
            esac
            FILTERED=()
            for jar in "${JARS[@]}"; do
              if [[ "$(basename "$jar")" == spore_and_stem-*-"${MC_FILTER}"-"${VERSION}".jar ]]; then
                FILTERED+=("$jar")
              fi
            done
            JARS=("${FILTERED[@]}")
            echo "Uploading only Minecraft ${MC_FILTER}:"
          fi
          printf '%s\n' "${JARS[@]}"
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "list<<$EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${JARS[@]}" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: verified-release
          path: dist/*.jar

      - name: Same-day guard (again, right before upload)
        if: ${{ inputs.dry_run != 'true' }}
        env:
          MODRINTH_ID: ${{ vars.MODRINTH_ID || secrets.MODRINTH_ID || '56wxSt5P' }}
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID || secrets.CURSEFORGE_ID || '1390363' }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISH_WORKFLOW: publish.yml
          UPLOAD_STEP: Upload Modrinth + CurseForge
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/same_day_guard.mjs

      - name: Upload Modrinth + CurseForge
        if: ${{ inputs.dry_run != 'true' }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          # The CurseForge upload API token, under either name.
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN || secrets.CURSEFORGE_API_KEY }}
          MODRINTH_ID: ${{ vars.MODRINTH_ID || secrets.MODRINTH_ID || '56wxSt5P' }}
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID || secrets.CURSEFORGE_ID || '1390363' }}
          VERSION: ${{ steps.ver.outputs.version }}
          JAR_LIST: ${{ steps.jars.outputs.list }}
          DRY_RUN: ${{ inputs.dry_run == 'true' && 'true' || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${DRY_RUN}" != "true" ]]; then
            # Fail before any upload, naming what is missing (a failed `test` inside `&&` does not stop `set -e`).
            missing=()
            for name in MODRINTH_TOKEN CURSEFORGE_TOKEN MODRINTH_ID CURSEFORGE_ID; do
              [[ -n "${!name:-}" ]] || missing+=("${name}")
            done
            if (( ${#missing[@]} )); then
              echo "::error::Not set in Settings > Secrets and variables > Actions: ${missing[*]} (tokens are secrets, the two IDs are variables)" >&2
              exit 1
            fi
          fi
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const version = process.env.VERSION;
          const dryRun = process.env.DRY_RUN === 'true';
          const JAR_RE = /^spore_and_stem-(fabric|neoforge|forge)-(\d+(?:\.\d+){1,2})-(\d+\.\d+\.\d+)\.jar$/i;
          const CF_LOADER_IDS = { fabric: 7499, forge: 7498, neoforge: 10150 };

          function parseJar(jar) {
            const name = path.basename(jar);
            const m = name.match(JAR_RE);
            if (!m) {
              throw new Error(
                'Cannot parse loader/game from ' + name +
                ' (expected spore_and_stem-<loader>-<minecraft>-<modVersion>.jar)',
              );
            }
            return { jar, name, loader: m[1].toLowerCase(), game: m[2], modVersion: m[3] };
          }

          function loaderLabel(loader) {
            if (loader === 'neoforge') return 'NeoForge';
            if (loader === 'forge') return 'Forge';
            return 'Fabric';
          }

          async function readJson(url, headers, allowStatuses = []) {
            const res = await fetch(url, { headers });
            const text = await res.text();
            if (!res.ok) {
              if (allowStatuses.includes(res.status)) return { ok: false, status: res.status, json: null, text };
              throw new Error(url + ' -> ' + res.status + ' ' + text.slice(0, 400));
            }
            return { ok: true, status: res.status, json: text ? JSON.parse(text) : null, text };
          }

          // CurseForge ids all come from the upload API (the API the files go to), looked up by name.
          const CF = 'https://minecraft.curseforge.com';
          let cfVersionsCache = null;
          async function cfVersions() {
            if (!cfVersionsCache) {
              const res = await readJson(CF + '/api/game/versions', { 'X-Api-Token': process.env.CURSEFORGE_TOKEN });
              cfVersionsCache = Array.isArray(res.json) ? res.json : res.json?.data || [];
            }
            return cfVersionsCache;
          }
          async function cfTypeIds(slugTest) {
            const res = await readJson(CF + '/api/game/version-types', { 'X-Api-Token': process.env.CURSEFORGE_TOKEN });
            const types = Array.isArray(res.json) ? res.json : res.json?.data || [];
            return types.filter((t) => slugTest.test(t.slug || '')).map((t) => t.id);
          }
          let cfMinecraftTypes = null;
          async function resolveCurseForgeGameId(game) {
            cfMinecraftTypes ??= await cfTypeIds(/^minecraft-\d/);
            const hit = (await cfVersions()).find((v) => v.name === game && cfMinecraftTypes.includes(v.gameVersionTypeID));
            if (!hit) throw new Error('No CurseForge Minecraft version named ' + game);
            console.log('CF Minecraft', game, '-> id', hit.id, 'type', hit.gameVersionTypeID);
            return hit.id;
          }
          async function resolveNamedLegacyId(want, fallback) {
            const hit = (await cfVersions()).find((v) => v.name === want);
            if (!hit && !fallback) throw new Error('No CurseForge version named ' + want);
            return hit ? hit.id : fallback;
          }

          const jars = process.env.JAR_LIST.split(/\n/).map((s) => s.trim()).filter(Boolean)
            .filter((j) => {
              const n = path.basename(j).toLowerCase();
              return !n.includes('-sources') && !n.includes('-javadoc') && !n.includes('-dev') && !n.includes('-shadow') && !n.includes('-common-');
            });
          if (!jars.length) throw new Error('No release jars to publish');
          const parsed = jars.map(parseJar);
          for (const p of parsed) {
            console.log('Parsed', p.name, '-> loader=' + p.loader, 'minecraft=' + p.game);
          }

          (async () => {
            if (dryRun) {
              console.log('Dry run: skipping uploads for', parsed.length, 'jars');
              return;
            }

            const notes = 'patchnotes/' + version + '.md';
            const changelog = fs.existsSync(notes)
              ? fs.readFileSync(notes, 'utf8')
              : (fs.existsSync('CHANGELOG.md') ? fs.readFileSync('CHANGELOG.md', 'utf8') : ('Release ' + version));

            // Resolve every CurseForge id before uploading anything, so a lookup failure cannot leave a half release.
            const clientId = await resolveNamedLegacyId('Client');
            const serverId = await resolveNamedLegacyId('Server');
            const cfLoaderIds = {};
            for (const loader of new Set(parsed.map((p) => p.loader))) {
              cfLoaderIds[loader] = await resolveNamedLegacyId(loaderLabel(loader), CF_LOADER_IDS[loader]);
            }
            const cfGameIds = {};
            for (const game of new Set(parsed.map((p) => p.game))) {
              cfGameIds[game] = await resolveCurseForgeGameId(game);
            }

            // Modrinth versions already published (a re-run skips them instead of uploading twice).
            const existing = await readJson(
              'https://api.modrinth.com/v2/project/' + process.env.MODRINTH_ID + '/version',
              { Authorization: process.env.MODRINTH_TOKEN },
            );
            const published = new Set((existing.json || []).map((v) => v.version_number));

            for (const p of parsed) {
              const body = {
                name: version + ' · ' + loaderLabel(p.loader) + ' · ' + p.game,
                version_number: version + '+' + p.loader + '-' + p.game,
                changelog,
                // Fabric API (Modrinth project P7dR8mSH) is required on Fabric.
                dependencies: p.loader === 'fabric' ? [{ project_id: 'P7dR8mSH', dependency_type: 'required' }] : [],
                game_versions: [p.game],
                version_type: 'release',
                loaders: [p.loader],
                featured: false,
                status: 'listed',
                project_id: process.env.MODRINTH_ID,
                file_parts: ['file_0'],
                primary_file: 'file_0',
              };
              if (published.has(body.version_number)) {
                console.log('Modrinth already has', body.version_number, '- skipped');
                continue;
              }
              const form = new FormData();
              form.append('data', JSON.stringify(body));
              form.append('file_0', new Blob([fs.readFileSync(p.jar)]), p.name);
              const mrRes = await fetch('https://api.modrinth.com/v2/version', {
                method: 'POST',
                headers: { Authorization: process.env.MODRINTH_TOKEN },
                body: form,
              });
              const mrText = await mrRes.text();
              if (!mrRes.ok) throw new Error('Modrinth ' + mrRes.status + ' ' + p.name + ' ' + mrText.slice(0, 500));
              console.log('Modrinth OK', body.version_number, p.name);
            }

            for (const p of parsed) {
              const meta = {
                changelog,
                ...(p.loader === 'fabric' ? { relations: { projects: [{ slug: 'fabric-api', type: 'requiredDependency' }] } } : {}),
                changelogType: 'markdown',
                displayName: version + ' · ' + loaderLabel(p.loader) + ' · ' + p.game,
                gameVersions: [clientId, serverId, cfLoaderIds[p.loader], cfGameIds[p.game]],
                releaseType: 'release',
              };
              const cfForm = new FormData();
              cfForm.append('metadata', JSON.stringify(meta));
              cfForm.append('file', new Blob([fs.readFileSync(p.jar)]), p.name);
              const cfRes = await fetch(
                CF + '/api/projects/' + process.env.CURSEFORGE_ID + '/upload-file',
                { method: 'POST', headers: { 'X-Api-Token': process.env.CURSEFORGE_TOKEN }, body: cfForm },
              );
              const cfText = await cfRes.text();
              if (!cfRes.ok) throw new Error('CurseForge ' + cfRes.status + ' ' + p.name + ' ' + cfText.slice(0, 500));
              console.log('CurseForge OK', meta.displayName, p.name, 'gameVersions=' + meta.gameVersions.join(','));
            }
          })().catch((e) => { console.error(e); process.exit(1); });
          NODE

      # CurseForge has no API for the project description: paste marketing/curseforge/description.md there by hand.
      - name: Update Modrinth listing
        if: ${{ inputs.update_listing == 'true' && inputs.dry_run != 'true' }}
        continue-on-error: true
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_ID: ${{ vars.MODRINTH_ID || secrets.MODRINTH_ID || '56wxSt5P' }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          (async () => {
            const headers = { Authorization: process.env.MODRINTH_TOKEN };
            const project = `https://api.modrinth.com/v2/project/${process.env.MODRINTH_ID}`;
            const body = fs.readFileSync('marketing/modrinth/description.md', 'utf8');
            const description = fs.readFileSync('marketing/modrinth/summary.txt', 'utf8').trim();
            const res = await fetch(project, {
              method: 'PATCH',
              headers: { ...headers, 'Content-Type': 'application/json' },
              body: JSON.stringify({ body, description }),
            });
            if (!res.ok) throw new Error('Modrinth listing ' + res.status + ' ' + (await res.text()).slice(0, 300));
            console.log('Modrinth description and summary updated');
          })().catch((e) => { console.error(e); process.exit(1); });
          NODE
